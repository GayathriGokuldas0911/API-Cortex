# Prometheus Configuration for API Cortex
global:
  scrape_interval: 30s
  scrape_timeout: 25s
  evaluation_interval: 30s

scrape_configs:
  - job_name: 'api-cortex-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['127.0.0.1:8000']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['127.0.0.1:9090']
